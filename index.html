    <style>
        :root {
            --bg-primary: #0a0d14;
            --bg-card: rgba(18, 24, 38, 0.75);
            --bg-card-hover: rgba(28, 36, 56, 0.85);
            --border: rgba(255, 255, 255, 0.08);
            --accent-primary: #6366f1;
            --accent-glow: rgba(99, 102, 241, 0.25);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --success: #10b981;
            --success-glow: rgba(16, 185, 129, 0.2);
            --warning: #f59e0b;
            --disabled: #6b7280;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-main);
            min-height: 100vh;
            padding: 2rem 1.5rem;
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(99, 102, 241, 0.15) 0%, transparent 45%),
                radial-gradient(circle at 85% 85%, rgba(16, 185, 129, 0.1) 0%, transparent 45%);
            background-attachment: fixed;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 2rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid var(--border);
        }

        .logo-title {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .logo-title h1 {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, #fff 0%, #a5b4fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-top: 0.25rem;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.25rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .stat-card .label {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.5rem;
        }

        .stat-card .value {
            font-size: 2rem;
            font-weight: 700;
        }

        .controls {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            margin-bottom: 1.5rem;
        }

        .search-box {
            flex: 1;
            min-width: 280px;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 0.75rem 1rem 0.75rem 2.5rem;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text-main);
            font-family: inherit;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.2s ease;
        }

        .search-box input:focus {
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .search-icon {
            position: absolute;
            left: 0.85rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        .filter-select {
            padding: 0.75rem 1rem;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text-main);
            font-family: inherit;
            outline: none;
            cursor: pointer;
        }

        .apps-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.25rem;
        }

        .app-card {
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 1.25rem;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .app-card:hover {
            transform: translateY(-4px);
            background: var(--bg-card-hover);
            border-color: rgba(99, 102, 241, 0.3);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
        }

        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 0.75rem;
        }

        .app-title {
            font-size: 1.15rem;
            font-weight: 700;
            color: #fff;
            font-family: 'JetBrains Mono', monospace;
        }

        .badge {
            padding: 0.25rem 0.65rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .badge-active {
            background: var(--success-glow);
            color: var(--success);
            border: 1px solid rgba(16, 185, 129, 0.4);
        }

        .badge-disabled {
            background: rgba(107, 114, 128, 0.2);
            color: var(--disabled);
            border: 1px solid rgba(107, 114, 128, 0.3);
        }

        .app-meta {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
            font-size: 0.88rem;
            color: var(--text-muted);
        }

        .meta-row {
            display: flex;
            justify-content: space-between;
        }

        .meta-row span.val {
            color: #d1d5db;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.82rem;
        }

        footer {
            margin-top: 3rem;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.85rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--border);
        }
    </style>
</head>

        function renderApps(apps) {
            const grid = document.getElementById("appsGrid");
            grid.innerHTML = "";

            if (apps.length === 0) {
                grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: #9ca3af; padding: 3rem;">Aucune application ne correspond à votre recherche.</div>`;
                return;
            }

            apps.forEach(app => {
                const card = document.createElement("div");
                card.className = "app-card";
                card.innerHTML = `
                    <div class="app-header">
                        <div class="app-title">${app.name}</div>
                        <span class="badge ${app.badge_class}">${app.status}</span>
                    </div>
                    <div class="app-meta">
                        <div class="meta-row">
                            <span>Projet :</span>
                            <span class="val">${app.project}</span>
                        </div>
                        <div class="meta-row">
                            <span>Namespace :</span>
                            <span class="val">${app.namespace}</span>
                        </div>
                        <div class="meta-row">
                            <span>Source / Chart :</span>
                            <span class="val" title="${app.chart}">${app.chart.length > 25 ? app.chart.substring(0, 22) + '...' : app.chart}</span>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterApps() {
            const search = document.getElementById("searchInput").value.toLowerCase();
            const project = document.getElementById("projectFilter").value;
            const status = document.getElementById("statusFilter").value;

            const filtered = rawApps.filter(app => {
                const matchSearch = app.name.toLowerCase().includes(search) || 
                                    app.project.toLowerCase().includes(search) || 
                                    app.namespace.toLowerCase().includes(search) ||
                                    app.chart.toLowerCase().includes(search);
                const matchProject = (project === "ALL" || app.project === project);
                const matchStatus = (status === "ALL" || app.status === status);

                return matchSearch && matchProject && matchStatus;
            });

            renderApps(filtered);
        }

        // Initial render
        renderApps(rawApps);
    </script>
