        :root {
            --bg-primary: #090d16;
            --bg-card: rgba(17, 24, 39, 0.78);
            --bg-card-hover: rgba(28, 38, 62, 0.92);
            --border: rgba(255, 255, 255, 0.08);
            --accent-primary: #6366f1;
            --accent-glow: rgba(99, 102, 241, 0.25);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --success: #10b981;
            --success-glow: rgba(16, 185, 129, 0.2);
            --disabled: #6b7280;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-main);
            min-height: 100vh;
            padding: 2rem 1.5rem;
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(99, 102, 241, 0.18) 0%, transparent 45%),
                radial-gradient(circle at 85% 85%, rgba(16, 185, 129, 0.12) 0%, transparent 45%);
            background-attachment: fixed;
        }

        .container {
            max-width: 1440px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 2rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid var(--border);
        }

        .logo-title {
            display: flex;
            align-items: center;
            gap: 0.85rem;
        }

        .logo-title h1 {
            font-size: 1.9rem;
            font-weight: 800;
            background: linear-gradient(135deg, #fff 0%, #a5b4fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-top: 0.25rem;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: var(--bg-card);
            backdrop-filter: blur(14px);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 1.25rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .stat-card:hover {
            transform: translateY(-2px);
            border-color: rgba(99, 102, 241, 0.3);
        }

        .stat-card .label {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.5rem;
        }

        .stat-card .value {
            font-size: 2rem;
            font-weight: 700;
        }

        .controls {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            margin-bottom: 1.75rem;
        }

        .search-box {
            flex: 1;
            min-width: 280px;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 0.75rem 1rem 0.75rem 2.5rem;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text-main);
            font-family: inherit;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.2s ease;
        }

        .search-box input:focus {
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .search-icon {
            position: absolute;
            left: 0.85rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        .filter-select {
            padding: 0.75rem 1rem;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text-main);
            font-family: inherit;
            outline: none;
            cursor: pointer;
        }

        .apps-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
            gap: 1.35rem;
        }

        .app-card {
            background: var(--bg-card);
            backdrop-filter: blur(14px);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 1.25rem;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .app-card:hover {
            transform: translateY(-4px);
            background: var(--bg-card-hover);
            border-color: rgba(99, 102, 241, 0.35);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
        }

        .app-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.75rem;
            margin-bottom: 1rem;
        }

        .app-title-group {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            overflow: hidden;
        }

        .app-icon-wrapper {
            width: 42px;
            height: 42px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.06);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            border: 1px solid rgba(255, 255, 255, 0.1);
            overflow: hidden;
        }

        .app-icon {
            width: 100%;
            height: 100%;
            object-fit: contain;
            padding: 4px;
        }

        .app-title {
            font-size: 1.15rem;
            font-weight: 700;
            color: #fff;
            font-family: 'JetBrains Mono', monospace;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .badge {
            padding: 0.25rem 0.65rem;
            border-radius: 20px;
            font-size: 0.72rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            flex-shrink: 0;
        }

        .badge-active {
            background: var(--success-glow);
            color: var(--success);
            border: 1px solid rgba(16, 185, 129, 0.4);
        }

        .badge-disabled {
            background: rgba(107, 114, 128, 0.2);
            color: var(--disabled);
            border: 1px solid rgba(107, 114, 128, 0.3);
        }

        .app-meta {
            display: flex;
            flex-direction: column;
            gap: 0.45rem;
            font-size: 0.88rem;
            color: var(--text-muted);
            margin-bottom: 1rem;
        }

        .meta-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .meta-row span.val {
            color: #d1d5db;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.82rem;
        }

        .ingress-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            width: 100%;
            padding: 0.65rem;
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.2) 0%, rgba(79, 70, 229, 0.3) 100%);
            border: 1px solid rgba(99, 102, 241, 0.4);
            border-radius: 8px;
            color: #a5b4fc;
            font-weight: 600;
            font-size: 0.85rem;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .ingress-btn:hover {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.35) 0%, rgba(79, 70, 229, 0.5) 100%);
            color: #fff;
            box-shadow: 0 4px 14px rgba(99, 102, 241, 0.3);
        }

        .no-ingress {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 0.65rem;
            background: rgba(255, 255, 255, 0.03);
            border: 1px dashed var(--border);
            border-radius: 8px;
            color: var(--text-muted);
            font-size: 0.82rem;
        }

        footer {
            margin-top: 3rem;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.85rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--border);
        }
    </style>
</head>

                </div>
                <p class="subtitle">Tableau de bord interactif des applications Kubernetes avec accès Ingress direct</p>
            </div>

        <div class="stats-grid">

            </div>

            </div>
            <div class="stat-card" onclick="quickFilter('Ingress')">

            <div class="stat-card" onclick="quickFilter('Disabled')">
                <div class="label">Désactivées</div>
                <div class="value" style="color: #6b7280;">70</div>
            </div>
        </div>

        <div class="controls">
            <div class="search-box">
                <span class="search-icon">🔍</span>
                <input type="text" id="searchInput" placeholder="Rechercher une application, namespace, ingress, chart..." oninput="filterApps()">
            </div>
            <select id="projectFilter" class="filter-select" onchange="filterApps()">
                <option value="ALL">Tous les projets</option>
                <option value="ai">ai</option><option value="default">default</option><option value="dev-tools">dev-tools</option><option value="disabled">disabled</option><option value="home">home</option><option value="infrastructure">infrastructure</option><option value="media">media</option><option value="observability">observability</option><option value="productivity">productivity</option><option value="sandbox">sandbox</option><option value="security">security</option><option value="storage">storage</option>
            </select>
            <select id="statusFilter" class="filter-select" onchange="filterApps()">
                <option value="ALL">Tous les statuts</option>
                <option value="Active">Actives</option>
                <option value="Disabled">Désactivées</option>
            </select>
        </div>

        <div class="apps-grid" id="appsGrid">
            <!-- Rendered by JS -->
        </div>

        <footer>
            Généré automatiquement par la CI jo3 GitOps Dashboard • Mis à jour régulièrement
        </footer>

        function handleIconError(img, appName) {
            const clean = appName.toLowerCase().replace(/[-_]/g, "").replace(/sbx|dev|prd|vs/g, "");
            
            // Step 1: try raw GitHub walkxcode dashboard-icons repo
            if (!img.dataset.triedDashboard) {
                img.dataset.triedDashboard = "true";
                img.src = `https://raw.githubusercontent.com/walkxcode/dashboard-icons/main/png/${clean}.png`;
                return;
            }
            
            // Step 2: try SimpleIcons CDN
            if (!img.dataset.triedSimple) {
                img.dataset.triedSimple = "true";
                img.src = `https://cdn.simpleicons.org/${clean}`;
                return;
            }

            // Step 3: Fallback to vibrant 2-letter gradient avatar
            const wrapper = img.parentElement;
            const words = appName.split(/[-_]/);
            let initials = "";
            if (words.length >= 2 && words[1].length > 0) {
                initials = (words[0][0] + words[1][0]).toUpperCase();
            } else {
                initials = appName.substring(0, 2).toUpperCase();
            }

            let hash = 0;
            for (let i = 0; i < appName.length; i++) {
                hash = appName.charCodeAt(i) + ((hash << 5) - hash);
            }
            const hue = Math.abs(hash % 360);

            wrapper.style.background = `linear-gradient(135deg, hsl(${hue}, 65%, 42%) 0%, hsl(${(hue + 45) % 360}, 75%, 26%) 100%)`;
            wrapper.style.color = '#ffffff';
            wrapper.style.fontFamily = "'JetBrains Mono', monospace";
            wrapper.style.fontSize = '0.85rem';
            wrapper.style.fontWeight = '700';
            wrapper.style.letterSpacing = '0.05em';
            wrapper.innerHTML = initials;
        }

        function renderApps(apps) {
            const grid = document.getElementById("appsGrid");
            grid.innerHTML = "";

            if (apps.length === 0) {
                grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: #9ca3af; padding: 3rem;">Aucune application ne correspond à votre recherche.</div>`;
                return;
            }

            apps.forEach(app => {
                const card = document.createElement("div");
                card.className = "app-card";
                
                const ingressHtml = app.ingress_url ? 
                    `<a href="${app.ingress_url}" target="_blank" rel="noopener noreferrer" class="ingress-btn">🌐 Ouvrir (${app.ingress_url.replace("https://", "")})</a>` : 
                    `<div class="no-ingress">Aucune route Ingress publique</div>`;

                card.innerHTML = `
                    <div>
                        <div class="app-header">
                            <div class="app-title-group">
                                <div class="app-icon-wrapper">
                                    <img class="app-icon" src="${app.icon_url}" alt="${app.name}" onerror="handleIconError(this, '${app.name}')">
                                </div>
                                <div class="app-title">${app.name}</div>
                            </div>
                            <span class="badge ${app.badge_class}">${app.status}</span>
                        </div>
                        <div class="app-meta">
                            <div class="meta-row">
                                <span>Projet :</span>
                                <span class="val">${app.project}</span>
                            </div>
                            <div class="meta-row">
                                <span>Namespace :</span>
                                <span class="val">${app.namespace}</span>
                            </div>
                            <div class="meta-row">
                                <span>Source / Chart :</span>
                                <span class="val" title="${app.chart}">${app.chart.length > 22 ? app.chart.substring(0, 19) + '...' : app.chart}</span>
                            </div>
                        </div>
                    </div>
                    <div>
                        ${ingressHtml}
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function quickFilter(type) {
            if (type === "ALL") {
                document.getElementById("statusFilter").value = "ALL";
                document.getElementById("searchInput").value = "";
            } else if (type === "Active") {
                document.getElementById("statusFilter").value = "Active";
            } else if (type === "Disabled") {
                document.getElementById("statusFilter").value = "Disabled";
            } else if (type === "Ingress") {
                document.getElementById("statusFilter").value = "ALL";
                document.getElementById("searchInput").value = ".zacharie.org";
            }
            filterApps();
        }

        function filterApps() {
            const search = document.getElementById("searchInput").value.toLowerCase();
            const project = document.getElementById("projectFilter").value;
            const status = document.getElementById("statusFilter").value;

            const filtered = rawApps.filter(app => {
                const matchSearch = app.name.toLowerCase().includes(search) || 
                                    app.project.toLowerCase().includes(search) || 
                                    app.namespace.toLowerCase().includes(search) ||
                                    app.ingress_url.toLowerCase().includes(search) ||
                                    app.chart.toLowerCase().includes(search);
                const matchProject = (project === "ALL" || app.project === project);
                const matchStatus = (status === "ALL" || app.status === status);

                return matchSearch && matchProject && matchStatus;
            });

            renderApps(filtered);
        }

        // Initial render
        renderApps(rawApps);
    </script>
